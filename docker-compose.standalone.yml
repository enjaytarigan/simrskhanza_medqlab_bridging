services:
  mysql:
    image: mariadb:11
    container_name: lis-khanza-mapper-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: mapper
      MYSQL_USER: mapper
      MYSQL_PASSWORD: mapper
      MYSQL_ROOT_PASSWORD: mapper
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mapper_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lis-khanza-mapper
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:8080"
    env_file:
      - .env.standalone
    environment:
      APP_LISTEN: ":8080"
      APP_ENV: production
      MAPPER_MODE: standalone
      DATABASE_DSN: mapper:mapper@tcp(mysql:3306)/mapper?parseTime=true&loc=Local&charset=utf8mb4

volumes:
  mapper_mysql:
